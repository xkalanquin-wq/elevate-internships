<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>Business Internship Finder by ZIP Code | Elevate Internships</title>
    <meta
      name="description"
      content="Find real internships near your ZIP code and the free and paid certifications that fit your business major — accounting, finance, marketing, analytics and more. Track what you finish."
    />
    <meta
      name="keywords"
      content="business internships, student internships, finance internship, accounting internship, marketing internship, free certifications, CPA, CFA, business analytics"
    />
    <meta name="author" content="Elevate Internships" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <link rel="canonical" href="__SITE_URL__/" />

    <!-- Open Graph: Facebook, LinkedIn, Slack, Discord -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Elevate Internships" />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:title" content="Elevate Internships — Internships &amp; Certifications for Business Students" />
    <meta
      property="og:description"
      content="Real internships near your ZIP code, and the free and paid certifications that fit your business major — priced honestly, tracked in one ledger."
    />
    <!-- Crawlers do not resolve relative paths, so these must be absolute. -->
    <meta property="og:image" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Elevate Internships — find the internship, earn the credential. 23 business majors, 222 certifications, searchable by ZIP and radius."
    />
    <meta property="og:locale" content="en_US" />

    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Elevate Internships — Internships &amp; Certifications for Business Students" />
    <meta
      name="twitter:description"
      content="Real internships near your ZIP code, and the free and paid certifications that fit your business major — priced honestly, tracked in one ledger."
    />
    <meta name="twitter:image" content="__SITE_URL__/twitter-image.png" />
    <meta
      name="twitter:image:alt"
      content="Elevate Internships — find the internship, earn the credential."
    />

    <meta name="theme-color" content="#f7f9fc" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1220" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="Elevate" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="/site.webmanifest" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Elevate Internships",
            "url": "__SITE_URL__/",
            "description": "Business internships near you and the certifications that fit your major, for college students."
          },
          {
            "@type": "Organization",
            "name": "Elevate Internships",
            "url": "__SITE_URL__/",
            "logo": "__SITE_URL__/og-square.png"
          }
        ]
      }
    </script>

    <!--
      Google Fonts is loaded at runtime by src/consent.js, and only after the
      visitor accepts, because requesting it discloses their IP to Google.
      Until then the system font stack is used.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
