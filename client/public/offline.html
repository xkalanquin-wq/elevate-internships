<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <title>You're offline | Elevate Internships</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="theme-color" content="#1e3a5f" />
    <style>
      :root {
        --bg: #f7f9fc;
        --surface: #ffffff;
        --ink: #0f172a;
        --muted: #475569;
        --rule: #d6dee8;
        --accent: #1e3a5f;
        --on-accent: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0b1220;
          --surface: #111a2c;
          --ink: #e6edf6;
          --muted: #a3b1c4;
          --rule: #243149;
          --accent: #8fbcec;
          --on-accent: #0b1220;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px 16px;
        background: var(--bg);
        color: var(--ink);
        font-family: Georgia, 'Times New Roman', serif;
      }
      main {
        width: 100%;
        max-width: 440px;
        padding: 32px 24px;
        border: 1px solid var(--rule);
        border-radius: 12px;
        background: var(--surface);
        text-align: center;
      }
      img {
        width: 64px;
        height: 64px;
      }
      h1 {
        margin: 16px 0 8px;
        font-size: 26px;
      }
      p {
        margin: 0 0 20px;
        color: var(--muted);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-size: 15px;
        line-height: 1.55;
      }
      a {
        display: inline-block;
        min-height: 44px;
        padding: 12px 22px;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        font-weight: 600;
        text-decoration: none;
      }
    </style>
  </head>
  <body>
    <main>
      <img src="/favicon.svg" alt="" />
      <h1>You're offline</h1>
      <p>
        Elevate Internships needs a connection to search internships and sync your applications. Nothing you saved is
        lost. It will all be here when you reconnect.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
